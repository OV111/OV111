<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Vahe Ohanyan. Full-Stack Developer, Finance Background, Moving into Blockchain">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#8250df"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#eaeef2" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="1278" height="318" rx="16" fill="url(#bg)" stroke="#d0d7de" stroke-width="2"/>
  <rect x="2" y="2" width="1276" height="316" rx="15" fill="url(#grid)"/>
  <rect x="140" y="20" width="1000" height="280" fill="url(#fade)"/>
  <text x="640" y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="20" letter-spacing="6" fill="#656d76">YEREVAN, ARMENIA</text>
  <text x="640" y="182" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-1" fill="#1f2328">Vahe Ohanyan</text>
  <rect x="580" y="208" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="640" y="254" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#424a53">Full-Stack Developer  ·  Finance Background  ·  Moving into Blockchain</text>
